name: CI - Push request - Ubuntu

on:
  push:
    branches: ["2.2.x", "master", "workflow-test"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: mvn clean install
